<!doctype html>
<html lang="uz" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e14"><title>PC Usta — kompyuterni noldan ustagacha o'rganing</title>
<style>:root{--bg:#0a0e14;--bg2:#10161f;--card:#141b26;--card2:#1a2331;--line:#26324a;--tx:#e8eef7;--tx2:#9fb0c7;--ac:#4cc2ff;--ac2:#7c6cff;--ok:#2ecc8f;--warn:#ffb020;--err:#ff5b6e;--ph:#05070b;--ph2:#0d1219;--sh:0 8px 30px rgba(0,0,0,.45);--r:14px;color-scheme:dark}
:root[data-theme=light]{--bg:#f4f7fb;--bg2:#fff;--card:#fff;--card2:#eef3fa;--line:#d5deeb;--tx:#101828;--tx2:#51627a;--ac:#0a7cff;--ac2:#6a4cff;--ok:#0f9d63;--warn:#c77700;--err:#d6283f;--ph:#f3f6fa;--ph2:#e3e9f2;--sh:0 8px 30px rgba(20,40,80,.12);color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;min-height:100vh}
body.lock{overflow:hidden}
img,svg{max-width:100%}
a{color:var(--ac)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
h1{font-size:clamp(1.9rem,6vw,3.2rem)}h2{font-size:clamp(1.35rem,4vw,1.8rem)}h3{font-size:1.15rem}
p{margin:.6em 0}
.muted{color:var(--tx2)}
.grad{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
/* header */
.pc-head{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:8px 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.pc-head button,.pc-head .ib{background:var(--card);border:1px solid var(--line);border-radius:10px;width:42px;height:42px;font-size:18px;flex:none}
.pc-brand{font-weight:800;font-size:1.15rem;text-decoration:none;color:var(--tx);white-space:nowrap}
.pc-brand b{color:var(--ac)}
#progWrap{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
#progWrap .bar{flex:1;height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
#progBar{height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .5s}
#progText{font-size:.8rem;color:var(--tx2);white-space:nowrap}
.pc-layout{display:flex;max-width:1500px;margin:0 auto}
#side{width:310px;flex:none;position:sticky;top:59px;height:calc(100vh - 59px);overflow:auto;padding:14px;border-right:1px solid var(--line);background:var(--bg2)}
#main{flex:1;min-width:0;padding:22px clamp(14px,3vw,40px) 80px;outline:none}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.side-home{font-weight:700;text-decoration:none;color:var(--tx)}
.side-x{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
#side input[type=search],#side input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);margin-bottom:10px}
.side-part{margin-bottom:6px}
.side-part summary{cursor:pointer;font-weight:700;font-size:.9rem;padding:8px 4px;list-style:none}
.side-link{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:9px;text-decoration:none;color:var(--tx2);font-size:.9rem}
.side-link:hover{background:var(--card)}
.side-link.active{background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--tx);font-weight:600}
.sl-n{flex:none;min-width:2.2em;font-size:.75rem;color:var(--ac)}
.sl-t{flex:1}
.sl-ok{display:none;color:var(--ok);font-weight:700}
.side-link.done .sl-ok{display:inline}
.side-h{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2);margin:14px 4px 6px}
#backdrop{display:none}
@media(max-width:960px){
 #side{position:fixed;left:0;top:0;height:100%;z-index:80;transform:translateX(-105%);transition:transform .25s;width:min(88vw,340px);box-shadow:var(--sh)}
 body.drawer #side{transform:none}
 body.drawer #backdrop{display:block;position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55)}
 .side-x{display:inline-block}
 #progText{display:none}
}
@media(min-width:961px){#menuBtn{display:none}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);text-decoration:none;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--ac);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:#fff}
.btn.danger{background:var(--err);border-color:transparent;color:#fff}
.btn.small{padding:6px 12px;font-size:.88rem;border-radius:9px}
.btn.lg{padding:14px 24px;font-size:1.05rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.done{border-color:var(--ok);color:var(--ok)}
.chip{display:inline-block;padding:4px 12px;border-radius:99px;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac);font-size:.82rem;font-weight:600}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
/* hero & home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center;padding:clamp(18px,4vw,40px);border-radius:22px;background:radial-gradient(900px 300px at 10% 0,color-mix(in srgb,var(--ac) 20%,transparent),transparent),var(--card);border:1px solid var(--line);animation:up .6s both}
.hero .lead{font-size:1.1rem;color:var(--tx2)}
.hero-card{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:18px}
.hc-n{font-size:2rem;font-weight:800}.hc-l{font-weight:600}.hc-s{color:var(--tx2);font-size:.9rem}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.stats,.feats,.path,.cards,.scen-grid,.res-grid{display:grid;gap:14px;margin:18px 0}
.stats{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-size:1.7rem;color:var(--ac)}
.feats,.path,.cards,.scen-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.feat,.part-card,.card,.scen{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;overflow-wrap:anywhere;animation:up .5s both}
.feat-i{font-size:1.8rem}
.part-card{text-decoration:none;color:var(--tx);display:block;transition:.2s}
.part-card:hover,.scen:hover{transform:translateY(-3px);border-color:var(--ac)}
.s-h,.sec-h{margin:28px 0 8px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* lesson */
.lesson{max-width:860px;margin:0 auto}
.crumbs{color:var(--tx2);font-size:.88rem;margin-bottom:8px}
.lesson h1{font-size:clamp(1.6rem,5vw,2.4rem)}
.lesson .lead{font-size:1.1rem;color:var(--tx2)}
.lesson ul,.lesson ol{padding-left:1.4em}.lesson li{margin:.3em 0}
.l-ic{font-size:2rem}
.note{border-left:4px solid var(--ac);background:var(--card);border-radius:10px;padding:12px 16px;margin:16px 0}
.note.n-tip{border-color:var(--ok)}.note.n-warn{border-color:var(--warn)}.note.n-danger{border-color:var(--err)}
.n-ic{margin-right:6px}
.tw{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--card2);white-space:nowrap}
tr:last-child td{border-bottom:0}
.code,pre,code{font-family:ui-monospace,Consolas,monospace}
pre.code,.code{background:var(--ph);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;white-space:pre-wrap}
code{background:var(--card2);padding:1px 6px;border-radius:6px;font-size:.9em}
.quiz,.test-box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:20px 0}
.quiz-h,.q-t{font-weight:700;margin-bottom:8px}
.q-opts{display:grid;gap:8px}
.q-o{text-align:left;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card2)}
.q-o:hover:not(:disabled){border-color:var(--ac)}
.q-o.right{background:color-mix(in srgb,var(--ok) 25%,transparent);border-color:var(--ok)}
.q-o.wrong{background:color-mix(in srgb,var(--err) 25%,transparent);border-color:var(--err)}
.q-fb{margin-top:8px;color:var(--tx2)}
.pn{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:28px 0}
.pn-a{flex:1 1 220px;display:block;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-decoration:none;color:var(--tx)}
.pn-a:hover{border-color:var(--ac)}
.done-row{display:flex;justify-content:center;margin:20px 0}
.catlink,.tool-b{display:inline-block}
.tool,.tool-host{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:16px 0}
.tool-h{font-weight:700;margin-bottom:8px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fld label,.fld span{display:block;font-size:.85rem;color:var(--tx2)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;max-width:100%}
.fld input,.fld select{width:100%}
.res,.rb{background:var(--card2);border-radius:12px;padding:12px}
.res-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.rb b{display:block;font-size:1.4rem;color:var(--ac)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--card);border:0;padding:8px 14px}
.seg button.on,.chip-b.on{background:var(--ac);color:#fff}
.bits{display:flex;gap:6px;flex-wrap:wrap}
.bit{width:44px;height:52px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-weight:700}
.bit.on{background:var(--ac);color:#fff}
/* images / placeholders */
.ph{position:relative;aspect-ratio:4/3;width:100%;border-radius:12px;background:var(--ph);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-direction:column;gap:4px}
.ph img{width:100%;height:100%;object-fit:contain;padding:6px;image-rendering:auto}
.ph.raw img{background:#fff;border-radius:8px}
.ph.empty{background:repeating-linear-gradient(45deg,var(--ph),var(--ph) 10px,var(--ph2) 10px,var(--ph2) 20px)}
.ph-ic{font-size:2rem}.ph-tx{font-size:.75rem;color:var(--tx2);font-weight:700}
.ph.xs{width:44px;aspect-ratio:1;flex:none;border-radius:8px}.ph.xs .ph-ic{font-size:1.2rem}.ph.xs .ph-tx{display:none}
.ph.sm{width:84px;aspect-ratio:1;flex:none}.ph.sm .ph-ic{font-size:1.6rem}
.ph.big{aspect-ratio:4/3;max-height:340px}
/* catalog */
.chips,.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;align-items:center}
.chip-b{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:14px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0;text-align:left;transition:.2s}
.pcard:hover{transform:translateY(-3px);border-color:var(--ac)}
.pc-name{font-weight:700;overflow-wrap:anywhere}.pc-sub{font-size:.82rem;color:var(--tx2);overflow-wrap:anywhere}.pc-b{font-size:.75rem;color:var(--ac)}.pc-i{font-size:.8rem}
.pc-t,.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--card2)}
.used{color:var(--warn)}
.pd{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:18px}
@media(max-width:640px){.pd{grid-template-columns:1fr}}
.pd-price{font-size:1.6rem;font-weight:800;color:var(--ok)}
.pd-title{font-size:1.3rem;font-weight:800}.pd-sub,.pd-cat{color:var(--tx2)}
.pd-btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.wide-search{flex:1 1 220px}
.pagi,.row-end{display:flex;gap:8px;justify-content:center;margin:18px 0;flex-wrap:wrap}
/* modal */
.modal-ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:14px;animation:fade .2s}
.modal{background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:18px;width:min(560px,100%);max-height:calc(100vh - 28px);display:flex;flex-direction:column;box-shadow:var(--sh);animation:up .25s}
.modal.wide{width:min(900px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
.modal-title{margin:0;font-size:1.15rem}
.modal .x{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px;flex:none}
.modal .x:hover{background:var(--err);color:#fff}
.modal-body{padding:16px;overflow:auto;flex:1;overscroll-behavior:contain}
.modal-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;flex:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.settings .seg{margin:6px 0}
.toasts,#toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;box-shadow:var(--sh);animation:up .3s;transition:opacity .3s}
.toast.out{opacity:0}
/* game */
.game{max-width:1200px;margin:0 auto}
.rules{display:grid;gap:8px}.rule{padding:8px 12px;background:var(--card);border-radius:10px}
.sc-h{font-weight:800}.sc-i{font-size:2rem}
.hud{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;position:sticky;top:60px;z-index:20}
.hearts{letter-spacing:2px}
.steps-bar{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.steps-bar .on,.steps-bar .cur{background:var(--ac);color:#fff}
.steps-bar>*{padding:5px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:.85rem}
.steps-bar .done{background:var(--ok);color:#fff}
.g-grid{display:grid;grid-template-columns:300px 1fr;gap:16px}
@media(max-width:900px){.g-grid{grid-template-columns:1fr}}
.g-panel,.built,.hint-box,.final,.over-box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.b-row{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.b-n{font-weight:600;font-size:.88rem;overflow-wrap:anywhere}.b-p{margin-left:auto;font-weight:700;white-space:nowrap}.b-tot{font-weight:800;margin-top:8px}
.g-list{display:grid;gap:10px;margin-top:10px}
.g-card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-width:0;flex-wrap:wrap}
.g-info{flex:1 1 200px;min-width:0}.g-title{font-weight:700;overflow-wrap:anywhere}.g-pr{font-weight:800;color:var(--ok)}
.g-act{display:flex;flex-direction:column;gap:6px;justify-content:center}
.fb{padding:12px 14px;border-radius:12px;margin:10px 0;border:1px solid var(--line);background:var(--card2)}
.fb.err{border-color:var(--err);background:color-mix(in srgb,var(--err) 14%,transparent)}
.fb.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.fb.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.fb.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.goals{display:grid;gap:6px}
.rating{display:inline-grid;place-items:center;width:84px;height:84px;border-radius:50%;font-size:2.6rem;font-weight:900;color:#fff}
.r-S{background:linear-gradient(135deg,#ffb020,#ff5b6e)}.r-A{background:var(--ok)}.r-B{background:var(--ac)}.r-C{background:var(--tx2)}
.fin-parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.score-bars .bar{height:10px;border-radius:99px;background:var(--card2);overflow:hidden}
.score-bars .bar>i,.bar>b{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.issue{padding:8px 12px;border-left:3px solid var(--err);background:var(--card2);border-radius:8px;margin:6px 0}
.bad-t{color:var(--err)}.ok-t{color:var(--ok)}
.empty-state{text-align:center;padding:30px;color:var(--tx2)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{.pc-head,#side,.pn,.quiz{display:none}#main{padding:0}body{background:#fff;color:#000}}
.fp small,.fp b{display:block}.fp{display:flex;flex-direction:column;gap:6px;min-width:0}.fp .ph.sm{width:100%;aspect-ratio:4/3}
.b-tot{display:flex;justify-content:space-between}
.fb{position:relative}.fb .x{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card)}.fb b{display:block;padding-right:36px}
.crumbs a{margin-right:4px}.crumbs span{margin:0 4px}
.chip-b small,.chip-b i{margin-left:6px;opacity:.7;font-style:normal;font-size:.8em}
</style></head><body>
<header class="pc-head">
<button id="menuBtn" type="button" aria-label="Menyu" aria-expanded="false">☰</button>
<a class="pc-brand" href="#/">PC <b>Usta</b></a>
<div id="progWrap"><div class="bar"><div id="progBar"></div></div><span id="progText"></span></div>
<button id="themeBtn" type="button" aria-label="Rejim">🌙</button>
<button id="setBtn" type="button" aria-label="Sozlamalar" title="Sozlamalar">⚙️</button>
</header>
<div class="pc-layout"><nav id="side" aria-label="Darslar"></nav><main id="main" tabindex="-1"></main></div>
<div id="backdrop"></div><div id="toasts" aria-live="polite"></div>
<script>(function(){
/* ===== PC USTA: yadro (nom maydoni, ma'lumotlar bazasi, formatlash) ===== */
const PC = window.PC = {
  DB: [], byId: {},
  IMAGES: {},            // Bu yerga { "komponent-id": "data:image/jpeg;base64,..." } qo'shiladi
  IMG_BASE: "img/",      // Yoki rasmlarni shu papkaga <id>.jpg / <id>.png nomi bilan joylang
  CATS: [
    { k: "cpu",      t: "Protsessorlar",              s: "Protsessor",      i: "🧠", tip: "Protsessor soketi ona plata soketi bilan bir xil bo'lishi shart." },
    { k: "mobo",     t: "Ona platalar",               s: "Ona plata",       i: "🔌", tip: "Ona plata CPU soketini, RAM turini va korpus o'lchamini belgilaydi." },
    { k: "ram",      t: "Operativ xotira (RAM)",      s: "Operativ xotira", i: "💾", tip: "RAM turi (DDR3/DDR4/DDR5) ona plata bilan mos bo'lishi shart. Noutbuk (SO-DIMM) xotirasi stol kompyuteriga to'g'ri kelmaydi." },
    { k: "gpu",      t: "Video kartalar",             s: "Video karta",     i: "🎮", tip: "Video karta uzunligi korpusga sig'ishi va quvvat bloki kerakli ulagichlarga ega bo'lishi kerak." },
    { k: "storage",  t: "Saqlagichlar (SSD/HDD)",     s: "Saqlagich",       i: "🗄️", tip: "NVMe SSD uchun ona platada M.2 slot kerak. SATA disklar SATA kabel bilan ulanadi." },

    if (ps.spec.watts < need) add("error", ["psu", "cpu", "gpu"], "Quvvat yetarli emas: tizim ~" + need + " W talab qiladi, blok esa " + ps.spec.watts + " W beradi.", "Formula: protsessor + video karta + 120 W (plata, RAM, disk, ventilyator). Quvvat yetmasa, kompyuter yuklama ostida o'chib qoladi.");
    else if (ps.spec.watts < need * 1.25) add("warn", ["psu", "cpu", "gpu"], "Quvvat zaxirasi kam: hisob ~" + need + " W, blok " + ps.spec.watts + " W. Tavsiya etilgan zaxira 25% (~" + PC.psuRecommended(b) + " W).", "Zaxira blokning uzoq xizmat qilishi va kelajakda yangilash uchun kerak.");
  }

};

    box.appendChild(el("h3", { text: "Xarakteristikalar" }));
    var cpu = b.cpu, ram = b.ram, st = b.storage, gpu = b.gpu;

  function showCopy(text) {

  function textSummary() {

  /* Natija kartasini PNG qilish (matn asosida, mavzuga mos) */
  function downloadCard() {
    var b = G.build, r = G.result, s = r.s, dark = PC.theme === "dark";
    var W = 1080, rowsN = ORDER.length, H = 760 + rowsN * 74 + 220;
    var cv = document.createElement("canvas"); cv.width = W; cv.height = H; var c = cv.getContext("2d");
    c.fillStyle = dark ? "#0a0e14" : "#f4f7fb"; c.fillRect(0, 0, W, H);
    var g = c.createLinearGradient(0, 0, W, 0); g.addColorStop(0, "#2ee6b0"); g.addColorStop(1, "#5d8dff");
    c.fillStyle = g; c.fillRect(0, 0, W, 10);
    var fg = dark ? "#e8eef5" : "#13202c", mu = dark ? "#8fa0b3" : "#58697b", pn = dark ? "#121a24" : "#ffffff", ln = dark ? "#243244" : "#d5deea";
    c.textAlign = "center"; c.fillStyle = mu; c.font = "600 34px system-ui, sans-serif"; c.fillText("PC Usta — " + G.sc.t, W / 2, 90);
    c.fillStyle = g; c.font = "900 260px system-ui, sans-serif"; c.fillText(r.rating, W / 2, 360);
    c.fillStyle = fg; c.font = "600 40px system-ui, sans-serif"; c.fillText("Ball: " + r.final, W / 2, 430);
    c.fillStyle = mu; c.font = "30px system-ui, sans-serif"; c.fillText("Jami " + PC.money(s.total) + "  ·  Sarf ~" + s.need + " W", W / 2, 490);
    var y = 560; c.textAlign = "left";
    [["Ofis", s.sc.office], ["O'yin", s.sc.gaming], ["Montaj", s.sc.creator]].forEach(function (x) {
      c.fillStyle = fg; c.font = "600 28px system-ui, sans-serif"; c.fillText(x[0], 80, y);
      c.fillStyle = ln; c.fillRect(260, y - 24, 640, 26);
      c.fillStyle = g; c.fillRect(260, y - 24, 640 * x[1] / 100, 26);
      c.fillStyle = mu; c.font = "26px system-ui, sans-serif"; c.fillText(String(x[1]), 920, y); y += 56;
    });
    y += 20;
    ORDER.forEach(function (k) {
      c.fillStyle = pn; c.fillRect(60, y, W - 120, 62); c.strokeStyle = ln; c.strokeRect(60, y, W - 120, 62);
      c.fillStyle = mu; c.font = "24px system-ui, sans-serif"; c.fillText(PC.catBy[k].s, 84, y + 40);
      c.fillStyle = fg; c.font = "600 28px system-ui, sans-serif";
      var t = ttl(b[k]); while (c.measureText(t).width > 640 && t.length > 4) t = t.slice(0, -2); if (t !== ttl(b[k])) t += "…";
      c.fillText(t, 300, y + 41); y += 74;
    });
    c.textAlign = "center"; c.fillStyle = mu; c.font = "26px system-ui, sans-serif"; c.fillText("Sen ham o'z kompyuteringni yig'ib ko'r!", W / 2, y + 70);
    cv.toBlob(function (blob) {
      if (!blob) { PC.toast("Rasm yaratib bo'lmadi", "bad"); return; }
      var a = el("a", { href: URL.createObjectURL(blob), download: "pc-usta-natija.png" }); document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }, "image/png");
  }

  /* Sinov uchun ochiq funksiyalar */
  PC._game = { start: function (id) { var host = $(".game"); var sc = SCEN.filter(function (s) { return s.id === id; })[0]; startGame(host, sc); }, attempt: function (p) { attempt(p); }, state: function () { return G; }, IGPU: IGPU, SCEN: SCEN };
})();
